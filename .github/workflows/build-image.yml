name: build-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - drama3-speechcpp-fast.patch
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/drama3-speechcpp:0.11.2-fast
            ghcr.io/${{ env.OWNER }}/drama3-speechcpp:latest
